<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 104">
  <!-- 小云猫：趴在卡片边缘的吉祥物 -->
  <g stroke="#7d8db0" stroke-width="2" stroke-linejoin="round">
    <!-- 耳朵 -->
    <path d="M24 40 L30 6 L52 28 Z" fill="#f4f6fb"/>
    <path d="M96 40 L90 6 L68 28 Z" fill="#f4f6fb"/>
    <path d="M30 32 L33 15 L45 28 Z" fill="#ffc7d6" stroke="none"/>
    <path d="M90 32 L87 15 L75 28 Z" fill="#ffc7d6" stroke="none"/>
    <!-- 头 -->
    <ellipse cx="60" cy="58" rx="40" ry="32" fill="#fbfcff"/>
    <!-- 刘海 -->
    <path d="M22 54 Q30 26 60 26 Q90 26 98 54 Q88 40 78 46 Q72 34 62 44 Q54 32 46 46 Q36 38 22 54 Z" fill="#e9edf6"/>
  </g>
  <!-- 眼睛（开心眯眼） -->
  <path d="M40 62 q6 -7 12 0" fill="none" stroke="#2b3a5c" stroke-width="3" stroke-linecap="round"/>
  <path d="M68 62 q6 -7 12 0" fill="none" stroke="#2b3a5c" stroke-width="3" stroke-linecap="round"/>
  <!-- 腮红与嘴 -->
  <ellipse cx="38" cy="72" rx="7" ry="4" fill="#ffb3c6" opacity="0.8"/>
  <ellipse cx="82" cy="72" rx="7" ry="4" fill="#ffb3c6" opacity="0.8"/>
  <path d="M55 72 q5 5 10 0" fill="none" stroke="#2b3a5c" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 蓝色十字发夹 -->
  <g transform="translate(84 40) rotate(20)">
    <rect x="-9" y="-3" width="18" height="6" rx="3" fill="#38c6e8"/>
    <rect x="-3" y="-9" width="6" height="18" rx="3" fill="#38c6e8"/>
  </g>
  <!-- 小爪子 -->
  <g fill="#fbfcff" stroke="#7d8db0" stroke-width="2">
    <ellipse cx="34" cy="94" rx="12" ry="8"/>
    <ellipse cx="86" cy="94" rx="12" ry="8"/>
  </g>
  <!-- 闪光 -->
  <path d="M8 22 l6 4 M4 34 l8 0 M12 10 l3 7" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
